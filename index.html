<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>E-Shuleni Learning Progress - Single File Demo</title>
  <!-- Load Plotly from CDN -->
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0; 
      padding: 0; 
      text-align: center;
      background-color: #f4f4f4;
    }
    h1 {
      margin: 10px;
      color: #333;
    }
    .chart-container {
      background-color: #fff;
      margin: 15px auto;
      width: 90%;
      max-width: 1000px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 30px;
    }
    .chart {
      width: 100%;
      height: 400px;
    }
    .filter-controls {
      margin: 20px 0;
    }
    .filter-controls input {
      padding: 5px;
      margin-right: 5px;
    }
    .filter-controls button {
      padding: 5px 10px;
      margin-right: 5px;
    }
  </style>
</head>
<body>

  <h1>E-Shuleni Pilot 2025: Learning Progress (Demo)</h1>

  <!-- One input and two buttons for filtering across all 4 charts -->
  <div class="filter-controls">
    <input 
      type="text" 
      id="studentName" 
      placeholder="Type student name here"
    >
    <button onclick="filterAllCharts()">Show Only This Student</button>
    <button onclick="showAllCharts()">Show All Students</button>
  </div>

  <!-- First chart container -->
  <div class="chart-container">
    <h2>Chart #1: Example Data (Grade 3 - Levels)</h2>
    <div id="chart1" class="chart"></div>
  </div>

  <!-- Second chart container -->
  <div class="chart-container">
    <h2>Chart #2: Example Data (Grade 4 - Levels)</h2>
    <div id="chart2" class="chart"></div>
  </div>

  <!-- Third chart container -->
  <div class="chart-container">
    <h2>Chart #3: Example Data (Grade 3 - Performance)</h2>
    <div id="chart3" class="chart"></div>
  </div>

  <!-- Fourth chart container -->
  <div class="chart-container">
    <h2>Chart #4: Example Data (Grade 4 - Performance)</h2>
    <div id="chart4" class="chart"></div>
  </div>

  <script>
    /*******************************************
     * EXAMPLE DATA FOR CHART #1
     *******************************************/
    // Replace with your real data for Grade 3 - Levels
    const dataChart1 = [
      {
        x: ['Feb 1', 'Feb 5', 'Feb 10', 'Feb 15'],
        y: [2, 10, 20, 30],
        mode: 'lines+markers',
        name: 'ALVIN URIO'
      },
      {
        x: ['Feb 1', 'Feb 5', 'Feb 10', 'Feb 15'],
        y: [5, 15, 18, 35],
        mode: 'lines+markers',
        name: 'ALICE AKYOO'
      },
      {
        x: ['Feb 1', 'Feb 5', 'Feb 10', 'Feb 15'],
        y: [0, 7, 22, 25],
        mode: 'lines+markers',
        name: 'ANTLEGOD PALANGYO'
      }
      // etc. as many traces as needed
    ];
    const layoutChart1 = {
      title: 'Grade 3 - Levels',
      xaxis: { title: 'Date' },
      yaxis: { title: 'Value' }
    };

    /*******************************************
     * EXAMPLE DATA FOR CHART #2
     *******************************************/
    // Replace with your real data for Grade 4 - Levels
    const dataChart2 = [
      {
        x: ['Feb 1', 'Feb 5', 'Feb 10', 'Feb 15'],
        y: [3, 5, 10, 18],
        mode: 'lines+markers',
        name: 'ALVIN URIO'
      },
      {
        x: ['Feb 1', 'Feb 5', 'Feb 10', 'Feb 15'],
        y: [8, 14, 20, 25],
        mode: 'lines+markers',
        name: 'ALICE AKYOO'
      },
      {
        x: ['Feb 1', 'Feb 5', 'Feb 10', 'Feb 15'],
        y: [2, 9, 15, 28],
        mode: 'lines+markers',
        name: 'ANTLEGOD PALANGYO'
      }
      // etc...
    ];
    const layoutChart2 = {
      title: 'Grade 4 - Levels',
      xaxis: { title: 'Date' },
      yaxis: { title: 'Value' }
    };

    /*******************************************
     * EXAMPLE DATA FOR CHART #3
     *******************************************/
    // Replace with your real data for Grade 3 - Performance
    const dataChart3 = [
      {
        x: ['Feb 1', 'Feb 5', 'Feb 10', 'Feb 15'],
        y: [10, 35, 40, 70],
        mode: 'lines+markers',
        name: 'ALVIN URIO'
      },
      {
        x: ['Feb 1', 'Feb 5', 'Feb 10', 'Feb 15'],
        y: [20, 30, 50, 65],
        mode: 'lines+markers',
        name: 'ALICE AKYOO'
      },
      {
        x: ['Feb 1', 'Feb 5', 'Feb 10', 'Feb 15'],
        y: [15, 25, 60, 80],
        mode: 'lines+markers',
        name: 'ANTLEGOD PALANGYO'
      }
      // etc...
    ];
    const layoutChart3 = {
      title: 'Grade 3 - Performance',
      xaxis: { title: 'Date' },
      yaxis: { title: 'Score' }
    };

    /*******************************************
     * EXAMPLE DATA FOR CHART #4
     *******************************************/
    // Replace with your real data for Grade 4 - Performance
    const dataChart4 = [
      {
        x: ['Feb 1', 'Feb 5', 'Feb 10', 'Feb 15'],
        y: [12, 18, 30, 58],
        mode: 'lines+markers',
        name: 'ALVIN URIO'
      },
      {
        x: ['Feb 1', 'Feb 5', 'Feb 10', 'Feb 15'],
        y: [5, 12, 20, 40],
        mode: 'lines+markers',
        name: 'ALICE AKYOO'
      },
      {
        x: ['Feb 1', 'Feb 5', 'Feb 10', 'Feb 15'],
        y: [10, 22, 40, 55],
        mode: 'lines+markers',
        name: 'ANTLEGOD PALANGYO'
      }
      // etc...
    ];
    const layoutChart4 = {
      title: 'Grade 4 - Performance',
      xaxis: { title: 'Date' },
      yaxis: { title: 'Score' }
    };

    // Render each chart
    Plotly.newPlot('chart1', dataChart1, layoutChart1);
    Plotly.newPlot('chart2', dataChart2, layoutChart2);
    Plotly.newPlot('chart3', dataChart3, layoutChart3);
    Plotly.newPlot('chart4', dataChart4, layoutChart4);

    /**
     * Filter all four charts so that only the named trace is visible.
     * If trace.name matches the typed string (case-insensitive), we set visible=true;
     * otherwise, we set visible='legendonly'.
     */
    function filterAllCharts() {
      const inputName = document
        .getElementById('studentName')
        .value
        .trim()
        .toLowerCase();

      // We'll do this for each chart separately:
      filterOneChart('chart1', dataChart1, inputName);
      filterOneChart('chart2', dataChart2, inputName);
      filterOneChart('chart3', dataChart3, inputName);
      filterOneChart('chart4', dataChart4, inputName);
    }

    /**
     * Show all traces in all four charts
     */
    function showAllCharts() {
      showAllInOneChart('chart1', dataChart1);
      showAllInOneChart('chart2', dataChart2);
      showAllInOneChart('chart3', dataChart3);
      showAllInOneChart('chart4', dataChart4);
    }

    /**
     * Filter a single chart's data, comparing trace.name.toLowerCase() to inputName
     */
    function filterOneChart(divId, chartData, inputName) {
      const update = chartData.map(trace => {
        const nameLower = (trace.name || '').toLowerCase();
        if (nameLower === inputName) {
          return { visible: true };
        }
        return { visible: 'legendonly' };
      });
      Plotly.update(divId, update, {});
    }

    /**
     * Show all traces in a single chart
     */
    function showAllInOneChart(divId, chartData) {
      const update = chartData.map(() => ({ visible: true }));
      Plotly.update(divId, update, {});
    }
  </script>
</body>
</html>
